version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR per ecosystem instead of a dozen — these move together anyway.
      next:
        patterns: ["next", "eslint-config-next", "@next/*"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      codemirror:
        patterns: ["@codemirror/*", "@lezer/*", "codemirror"]
      dev-tooling:
        # @types/node belongs here: vitest declares it as a peer, so splitting
        # them into separate PRs gives you two that only build together.
        patterns: ["eslint*", "prettier", "vitest", "cspell", "husky", "lint-staged", "typescript", "@types/node"]

    ignore:
      # @types/node tracks the runtime in .nvmrc, not the newest release.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
