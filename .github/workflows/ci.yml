name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # msedge-tts ships a pnpm-only preinstall gate; its published dist is
      # prebuilt, so skipping lifecycle scripts is safe here.
      - run: npm ci --ignore-scripts

      # LayoutProps/PageProps are globally generated helper types that
      # tsc needs on disk before it can typecheck app/ routes.
      - name: Generate route types
        run: npx next typegen

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Formatting
        run: npm run format:check

      - name: Spelling
        run: npm run spell

      - name: Content integrity tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end smoke
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # Budgets are set just under what the site measures today, so this fails
      # on a regression rather than on noise. The CLI runs from the action
      # rather than from our dependencies: it pulls an old lighthouse and
      # puppeteer with it, which is thirteen advisories we do not need in the
      # lockfile for something that only ever runs in CI.
      - name: Lighthouse budgets
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./.lighthouserc.json
          temporaryPublicStorage: false

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: lighthouse-report
          path: .lighthouseci/
          retention-days: 7
