name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # msedge-tts ships a pnpm-only preinstall gate; its published dist is
      # prebuilt, so skipping lifecycle scripts is safe here.
      - run: npm ci --ignore-scripts

      # LayoutProps/PageProps are globally generated helper types that
      # tsc needs on disk before it can typecheck app/ routes.
      - name: Generate route types
        run: npx next typegen

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Comments
        run: npm run comments

      - name: Formatting
        run: npm run format:check

      - name: Spelling
        run: npm run spell

      - name: Content integrity tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end smoke
        run: npm run test:e2e

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # Budgets are set just under what the site measures today, so this fails
      # on a regression rather than on noise. The CLI runs from the action
      # rather than from our dependencies: it pulls an old lighthouse and
      # puppeteer with it, which is thirteen advisories we do not need in the
      # lockfile for something that only ever runs in CI.
      - name: Lighthouse budgets
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12.6.2
        with:
          configPath: ./.lighthouserc.json
          temporaryPublicStorage: false

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: lighthouse-report
          path: .lighthouseci/
          retention-days: 7
