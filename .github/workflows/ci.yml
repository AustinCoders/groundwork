name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # msedge-tts ships a pnpm-only preinstall gate; its published dist is
      # prebuilt, so skipping lifecycle scripts is safe here.
      - run: npm ci --ignore-scripts

      # LayoutProps/PageProps are globally generated helper types that
      # tsc needs on disk before it can typecheck app/ routes.
      - name: Generate route types
        run: npx next typegen

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Formatting
        run: npm run format:check

      - name: Spelling
        run: npm run spell

      - name: Content integrity tests
        run: npm test

      - name: Build
        run: npm run build
