    </script>
    <script id="app">
      (() => {
        "use strict";

        const AREAS = ["Privacy", "Data", "SEO", "Infra", "Growth", "Content", "Product"];
        const STATUSES = [
          { key: "todo", label: "To do" },
          { key: "doing", label: "Doing" },
          { key: "done", label: "Done" },
          { key: "blocked", label: "Blocked" },
        ];
        const STATUS_LABEL = Object.fromEntries(STATUSES.map((s) => [s.key, s.label]));
        const NEXT = { todo: "doing", doing: "done", done: "todo", blocked: "doing" };
        const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        const VIEW_KEY = "groundwork-roadmap-view";
        const FONT_LINKS = [
          '<link rel="preconnect" href="https://fonts.googleapis.com">',
          '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>',
          '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&family=Kalam:wght@400;700&display=swap">',
        ].join("\n");

        const root = document.getElementById("root");
        const sourceCss = document.getElementById("styles").textContent;
        const sourceApp = document.getElementById("app").textContent;

        let saved = normalize(safeParse(document.getElementById("roadmap-data").textContent));
        let state = clone(saved);
        const view = Object.assign({ status: "all", area: "all", q: "", scroll: 0 }, readView());

        let art = null;
        let artReady = false;
        let dl = null;
        let readOnly = false;
        let filesForm = null;
        let dirty = false;
        let saving = false;
        let saveTimer = 0;
        let searchTimer = 0;
        let cadence = 1200;
        let retried = false;
        let saveKind = "idle";
        let saveText = "";
        let justDone = null;

        let live, dlgTask, fTask, dlgPhase, fPhase, dlgText, fText;
        let editing = null;
        let editingPhase = null;
        let returnFocus = null;
        let textMode = null;

        /* ---------- small helpers ---------- */

        function safeParse(text) {
          try {
            return JSON.parse(text);
          } catch (_) {
            return {};
          }
        }
        function clone(v) {
          return JSON.parse(JSON.stringify(v));
        }
        function str(v) {
          return typeof v === "string" ? v.trim() : v == null ? "" : String(v).trim();
        }
        function isISO(v) {
          return typeof v === "string" && /^\d{4}-\d{2}-\d{2}$/.test(v);
        }
        function uid(prefix) {
          return prefix + Date.now().toString(36).slice(-5) + Math.random().toString(36).slice(2, 6);
        }
        function esc(v) {
          return String(v == null ? "" : v)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#39;");
        }
        function plural(n, word) {
          return n + " " + word + (n === 1 ? "" : "s");
        }
        function todayISO() {
          const d = new Date();
          return (
            d.getFullYear() +
            "-" +
            String(d.getMonth() + 1).padStart(2, "0") +
            "-" +
            String(d.getDate()).padStart(2, "0")
          );
        }
        function fmtDate(iso) {
          if (!isISO(iso)) return "";
          const [y, m, d] = iso.split("-").map(Number);
          return d + " " + MONTHS[m - 1] + " " + y;
        }
        function fmtShort(iso) {
          if (!isISO(iso)) return "";
          const [, m, d] = iso.split("-").map(Number);
          return d + " " + MONTHS[m - 1];
        }
        function safeLink(u) {
          return /^https?:\/\/\S+$/i.test(u || "") ? u : "";
        }
        function linkLabel(u) {
          try {
            const x = new URL(u);
            const m = x.pathname.match(/\/(pull|issues)\/(\d+)/);
            if (/(^|\.)github\.com$/.test(x.hostname) && m) return (m[1] === "pull" ? "PR #" : "Issue #") + m[2];
            return x.hostname.replace(/^www\./, "");
          } catch (_) {
            return "link";
          }
        }

        function normalize(raw) {
          const s = raw && typeof raw === "object" ? raw : {};
          const out = {
            version: 1,
            title: str(s.title) || "Groundwork roadmap",
            updatedAt: isISO(s.updatedAt) ? s.updatedAt : todayISO(),
            phases: [],
            tasks: [],
          };
          const seenP = new Set();
          (Array.isArray(s.phases) ? s.phases : []).forEach((p) => {
            if (!p || typeof p !== "object") return;
            let id = str(p.id) || uid("p");
            while (seenP.has(id)) id = uid("p");
            seenP.add(id);
            out.phases.push({ id, name: str(p.name) || "Untitled phase", note: str(p.note) });
          });
          if (!out.phases.length) {
            const id = uid("p");
            seenP.add(id);
            out.phases.push({ id, name: "Next up", note: "" });
          }
          const seenT = new Set();
          (Array.isArray(s.tasks) ? s.tasks : []).forEach((t) => {
            if (!t || typeof t !== "object" || !str(t.title)) return;
            let id = str(t.id) || uid("t");
            while (seenT.has(id)) id = uid("t");
            seenT.add(id);
            const status = STATUS_LABEL[t.status] ? t.status : "todo";
            out.tasks.push({
              id,
              phase: seenP.has(t.phase) ? t.phase : out.phases[0].id,
              title: str(t.title),
              why: str(t.why),
              status,
              effort: str(t.effort),
              area: str(t.area),
              source: str(t.source),
              link: safeLink(str(t.link)),
              notes: str(t.notes),
              doneOn: status === "done" && isISO(t.doneOn) ? t.doneOn : null,
            });
          });
          return out;
        }

        function find(id) {
          return state.tasks.find((t) => t.id === id) || null;
        }
        function tasksIn(phaseId) {
          return state.tasks.filter((t) => t.phase === phaseId);
        }

        /* ---------- effort maths ---------- */

        function parseEffort(text) {
          if (!text) return null;
          const m = String(text)
            .toLowerCase()
            .replace(/[–—]/g, "-")
            .match(/(\d+(?:\.\d+)?)\s*(?:-\s*(\d+(?:\.\d+)?))?\s*(hours?|hrs?|h|days?|d|weeks?|wks?|w)?\b/);
          if (!m) return null;
          const a = parseFloat(m[1]);
          const b = m[2] ? parseFloat(m[2]) : a;
          const unit = m[3] || "day";
          const f = unit[0] === "h" ? 1 / 8 : unit[0] === "w" ? 5 : 1;
          return [Math.min(a, b) * f, Math.max(a, b) * f];
        }

        function totals(list) {
          const t = { total: list.length, done: 0, doing: 0, blocked: 0, left: 0, unest: 0, min: 0, max: 0 };
          list.forEach((x) => {
            if (x.status === "doing") t.doing++;
            if (x.status === "blocked") t.blocked++;
            if (x.status === "done") {
              t.done++;
              return;
            }
            t.left++;
            const e = parseEffort(x.effort);
            if (!e) {
              t.unest++;
              return;
            }
            t.min += e[0];
            t.max += e[1];
          });
          return t;
        }

        function fmtDays(min, max) {
          if (max <= 0) return "";
          if (max < 0.5) {
            const hi = Math.max(1, Math.ceil(max * 8));
            const lo = Math.max(1, Math.floor(min * 8));
            return lo === hi ? plural(hi, "hr") : lo + "–" + hi + " hrs";
          }
          let lo = Math.floor(min * 2) / 2;
          const hi = Math.ceil(max * 2) / 2;
          if (lo === 0) lo = 0.5;
          const n = (x) => (x % 1 === 0 ? String(x) : x.toFixed(1));
          if (lo === hi) return n(lo) + (lo <= 1 ? " day" : " days");
          return n(lo) + "–" + n(hi) + " days";
        }

        /* ---------- hand-drawn marks ---------- */

        function hash(s) {
          let h = 2166136261;
          for (let i = 0; i < s.length; i++) {
            h ^= s.charCodeAt(i);
            h = Math.imul(h, 16777619);
          }
          return h >>> 0 || 1;
        }
        function rng(seed) {
          let x = seed || 1;
          return () => {
            x ^= x << 13;
            x >>>= 0;
            x ^= x >>> 17;
            x ^= x << 5;
            x >>>= 0;
            return (x % 10007) / 10007;
          };
        }
        function jitterer(seed) {
          const r = rng(hash(seed));
          return (v, amt) => +(v + (r() - 0.5) * 2 * amt).toFixed(2);
        }

        function boxSvg(status, id) {
          const j = jitterer("box:" + id);
          const c = [
            [3.2, 3.6],
            [20.8, 3.1],
            [20.5, 20.8],
            [3.5, 20.4],
          ].map(([x, y]) => [j(x, 0.8), j(y, 0.8)]);
          let d = "M" + c[0][0] + " " + c[0][1];
          for (let i = 1; i <= 4; i++) {
            const a = c[i - 1];
            const b = i === 4 ? [j(c[0][0] + 1.4, 0.3), j(c[0][1] - 0.2, 0.3)] : c[i];
            d += " Q " + j((a[0] + b[0]) / 2, 0.9) + " " + j((a[1] + b[1]) / 2, 0.9) + " " + b[0] + " " + b[1];
          }
          const k = jitterer("mark:" + status + ":" + id);
          let mark = "";
          if (status === "done") {
            mark =
              "M" +
              k(6.4, 0.5) +
              " " +
              k(12.6, 0.5) +
              " Q " +
              k(8.6, 0.5) +
              " " +
              k(15.2, 0.5) +
              " " +
              k(10.4, 0.4) +
              " " +
              k(17.8, 0.4) +
              " Q " +
              k(14.2, 0.6) +
              " " +
              k(10.2, 0.6) +
              " " +
              k(21.2, 0.5) +
              " " +
              k(3.6, 0.5);
          } else if (status === "doing") {
            mark =
              "M" +
              k(6.6, 0.5) +
              " " +
              k(17.4, 0.5) +
              " Q " +
              k(12, 0.8) +
              " " +
              k(12.4, 0.8) +
              " " +
              k(17.6, 0.5) +
              " " +
              k(6.6, 0.5);
          } else if (status === "blocked") {
            mark =
              "M" +
              k(6.8, 0.5) +
              " " +
              k(6.9, 0.5) +
              " L" +
              k(17.2, 0.5) +
              " " +
              k(17.3, 0.5) +
              " M" +
              k(17.1, 0.5) +
              " " +
              k(6.8, 0.5) +
              " L" +
              k(6.9, 0.5) +
              " " +
              k(17.2, 0.5);
          }
          return (
            '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path class="bx" d="' +
            d +
            '"/>' +
            (mark ? '<path class="mk" d="' + mark + '"/>' : "") +
            "</svg>"
          );
        }

        /* ---------- progress meter ---------- */

        function meterHtml(t, cls) {
          const pctOf = (n) => (t.total ? (n / t.total) * 100 : 0);
          const done = pctOf(t.done);
          const doing = pctOf(t.doing);
          const label = t.total
            ? t.done + " of " + t.total + " done" + (t.doing ? ", " + t.doing + " in progress" : "")
            : "No tasks yet";
          let segs = "";
          if (done > 0) segs += '<span class="seg seg-done" style="flex:0 0 ' + done.toFixed(2) + '%"></span>';
          if (doing > 0) segs += '<span class="seg seg-doing" style="flex:0 0 ' + doing.toFixed(2) + '%"></span>';
          return (
            '<div class="track' +
            (cls ? " " + cls : "") +
            '" role="img" aria-label="' +
            esc(label) +
            '">' +
            segs +
            "</div>"
          );
        }

        /* ---------- rendering ---------- */

        function focusKey() {
          const a = document.activeElement;
          return a && a.dataset && a.dataset.focus ? a.dataset.focus : null;
        }
        function restoreFocus(key, fallback) {
          const pick = (k) => (k ? root.querySelector('[data-focus="' + k + '"]') : null);
          const el = pick(key) || pick(fallback);
          if (el) el.focus({ preventScroll: true });
        }

        function saveMessage() {
          switch (saveKind) {
            case "pending":
              return "Unsaved changes";
            case "saving":
              return "Saving…";
            case "saved":
              return "All changes saved";
            case "readonly":
              return "View only";
            case "local":
              return "Saving isn’t available here. Export JSON to keep your changes.";
            case "conflict":
              return "Someone saved a newer version. Loading it now.";
            case "error":
              return saveText || "Couldn’t save. Your changes are still on screen.";
            default:
              return "";
          }
        }

        function headerHtml() {
          const t = totals(state.tasks);
          const left = fmtDays(t.min, t.max);
          const pct = t.total ? Math.round((t.done / t.total) * 100) : 0;
          const lede = readOnly
            ? "What’s left to build, in the order worth picking it up. This view is read-only."
            : "What’s left to build, in the order worth picking it up. Tap a box to move a task along — to do, doing, done. Tap a title to edit it.";
          return (
            '<header class="top">' +
            '<p class="eyebrow">groundwork.austincoders.com · roadmap</p>' +
            "<h1>" +
            esc(state.title) +
            "</h1>" +
            '<p class="lede">' +
            lede +
            "</p>" +
            '<div class="progress">' +
            '<div class="meter-top"><span class="pct">' +
            pct +
            "% done</span>" +
            '<span class="said">' +
            esc(
              left
                ? "about " + left + " of estimated work left"
                : t.left
                  ? plural(t.left, "task") + " left, none estimated"
                  : "nothing left on the list"
            ) +
            "</span></div>" +
            meterHtml(t) +
            "</div>" +
            '<dl class="stats">' +
            '<div class="stat"><dt><span class="swatch done"></span>Done</dt><dd>' +
            t.done +
            "<small>of " +
            t.total +
            "</small></dd></div>" +
            '<div class="stat"><dt><span class="swatch doing"></span>In progress</dt><dd>' +
            t.doing +
            "</dd></div>" +
            '<div class="stat"><dt><span class="swatch blocked"></span>Blocked</dt><dd>' +
            t.blocked +
            "</dd></div>" +
            '<div class="stat wide"><dt><span class="swatch"></span>Work left</dt><dd><span class="v">' +
            esc(left || "—") +
            "</span>" +
            (t.unest ? "<small>+" + t.unest + " unestimated</small>" : "") +
            "</dd></div>" +
            "</dl>" +
            '<div class="meta-top"><span id="lastchanged">Last saved ' +
            esc(fmtDate(saved.updatedAt)) +
            "</span>" +
            '<span id="savestate" class="savestate" data-kind="' +
            saveKind +
            '">' +
            esc(saveMessage()) +
            "</span></div>" +
            "</header>"
          );
        }

        function toolbarHtml() {
          const counts = { all: state.tasks.length };
          STATUSES.forEach((s) => {
            counts[s.key] = 0;
          });
          state.tasks.forEach((t) => {
            counts[t.status]++;
          });
          const chip = (key, label) =>
            '<button type="button" class="chip" data-act="filter" data-val="' +
            key +
            '" data-focus="filter:' +
            key +
            '" aria-pressed="' +
            (view.status === key) +
            '">' +
            label +
            '<span class="ct">' +
            counts[key] +
            "</span></button>";
          const areas = ["all"].concat(AREAS);
          return (
            '<div class="toolbar">' +
            '<div class="search">' +
            '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.6"/><path d="M10.4 10.4 L14 14"/></svg>' +
            '<label class="vh" for="q">Search tasks</label>' +
            '<input id="q" type="search" data-act="search" data-focus="search" placeholder="Search tasks…" autocomplete="off" spellcheck="false" value="' +
            esc(view.q) +
            '">' +
            "</div>" +
            '<div class="filters" role="group" aria-label="Show tasks">' +
            chip("all", "All") +
            STATUSES.map((s) => chip(s.key, s.label)).join("") +
            "</div>" +
            '<label class="area-pick"><span class="vh">Area</span><select data-act="area" data-focus="area">' +
            areas
              .map(
                (a) =>
                  '<option value="' +
                  a +
                  '"' +
                  (view.area === a ? " selected" : "") +
                  ">" +
                  (a === "all" ? "All areas" : a) +
                  "</option>"
              )
              .join("") +
            "</select></label>" +
            '<div class="tools">' +
            '<button type="button" class="btn" data-act="md" data-focus="md">Export Markdown</button>' +
            '<button type="button" class="btn" data-act="json" data-focus="json">Export JSON</button>' +
            (readOnly
              ? ""
              : '<button type="button" class="btn" data-act="import" data-focus="import">Import JSON</button>') +
            "</div></div>"
          );
        }

        function isFiltered() {
          return view.status !== "all" || view.area !== "all" || !!view.q;
        }

        function visible(t) {
          if (view.status !== "all" && t.status !== view.status) return false;
          if (view.area !== "all" && t.area !== view.area) return false;
          if (view.q) {
            const hay = (t.title + " " + t.why + " " + t.notes + " " + t.area + " " + t.source).toLowerCase();
            if (!hay.includes(view.q.toLowerCase())) return false;
          }
          return true;
        }

        function railHtml(groups) {
          if (!groups.length) return '<nav class="rail"></nav>';
          const items = groups
            .map((g) => {
              const t = totals(g.all);
              return (
                '<li><a href="#ph-' +
                esc(g.phase.id) +
                '">' +
                '<span class="rn">' +
                (g.index + 1) +
                "</span>" +
                '<span class="rname">' +
                esc(g.phase.name) +
                "</span>" +
                '<span class="rmeter">' +
                meterHtml(t, "mini") +
                '<span class="rct">' +
                t.done +
                "/" +
                t.total +
                "</span></span>" +
                "</a></li>"
              );
            })
            .join("");
          return '<nav class="rail" aria-label="Phases"><h2>Phases</h2><ol>' + items + "</ol></nav>";
        }

        function taskHtml(t, n) {
          const cls = "task s-" + t.status + (justDone === t.id ? " just-done" : "");
          const box = readOnly
            ? '<span class="box" role="img" aria-label="' +
              STATUS_LABEL[t.status] +
              '">' +
              boxSvg(t.status, t.id) +
              "</span>"
            : '<button type="button" class="box" data-act="cycle" data-id="' +
              esc(t.id) +
              '" data-focus="box:' +
              esc(t.id) +
              '" aria-label="' +
              esc(t.title) +
              ". " +
              STATUS_LABEL[t.status] +
              ". Mark as " +
              STATUS_LABEL[NEXT[t.status]].toLowerCase() +
              '.">' +
              boxSvg(t.status, t.id) +
              "</button>";
          const title = readOnly
            ? '<span class="title"><span class="tt">' + esc(t.title) + "</span></span>"
            : '<button type="button" class="title" data-act="edit" data-id="' +
              esc(t.id) +
              '" data-focus="title:' +
              esc(t.id) +
              '"><span class="tt">' +
              esc(t.title) +
              "</span></button>";
          const meta = [];
          if (t.status === "doing") meta.push('<span class="pill state doing"><span class="dot"></span>Doing</span>');
          if (t.status === "blocked")
            meta.push('<span class="pill state blocked"><span class="dot"></span>Blocked</span>');
          if (t.area) meta.push('<span class="pill">' + esc(t.area) + "</span>");
          if (t.source) meta.push('<span class="src">' + esc(t.source) + "</span>");
          if (t.link)
            meta.push(
              '<a href="' +
                esc(t.link) +
                '" target="_blank" rel="noopener noreferrer">' +
                esc(linkLabel(t.link)) +
                "</a>"
            );
          if (t.doneOn) meta.push('<span class="done-on">done ' + esc(fmtShort(t.doneOn)) + "</span>");
          return (
            '<li class="' +
            cls +
            '">' +
            '<span class="n" aria-hidden="true">' +
            n +
            "</span>" +
            box +
            '<div class="body"><div class="line1">' +
            title +
            (t.effort ? '<span class="effort">' + esc(t.effort) + "</span>" : "") +
            "</div>" +
            (t.why ? '<p class="why">' + esc(t.why) + "</p>" : "") +
            (t.notes ? '<p class="note">' + esc(t.notes) + "</p>" : "") +
            (meta.length ? '<p class="meta">' + meta.join("") + "</p>" : "") +
            "</div></li>"
          );
        }

        function phaseHtml(g, filtered) {
          const p = g.phase;
          const pt = totals(g.all);
          const left = fmtDays(pt.min, pt.max);
          let sub = "";
          if (g.all.length && !pt.left) sub = "all done";
          else if (left) sub = "about " + left + " left" + (pt.unest ? ", " + pt.unest + " not estimated" : "");
          else if (pt.left) sub = "not estimated yet";
          const pid = esc(p.id);
          return (
            '<section class="phase" id="ph-' +
            pid +
            '" aria-labelledby="phh-' +
            pid +
            '"><header class="phase-head">' +
            '<span class="phase-num" aria-hidden="true">' +
            (g.index + 1) +
            "</span>" +
            '<div><h2 id="phh-' +
            pid +
            '">' +
            (readOnly
              ? esc(p.name)
              : '<button type="button" class="phase-name" data-act="phase" data-id="' +
                pid +
                '" data-focus="phase:' +
                pid +
                '" title="Edit phase">' +
                esc(p.name) +
                "</button>") +
            "</h2>" +
            (p.note ? '<p class="phase-note">' + esc(p.note) + "</p>" : "") +
            "</div>" +
            '<div class="phase-stat">' +
            meterHtml(pt, "mini") +
            '<p class="pc">' +
            (g.all.length ? pt.done + " of " + g.all.length + " done" : "No tasks yet") +
            (sub ? "<span>" + esc(sub) + "</span>" : "") +
            "</p></div></header>" +
            '<ol class="tasks">' +
            g.vis.map((t) => taskHtml(t, g.all.indexOf(t) + 1)).join("") +
            "</ol>" +
            (readOnly || filtered
              ? ""
              : '<button type="button" class="add" data-act="add" data-phase="' +
                pid +
                '" data-focus="add:' +
                pid +
                '">Add a task</button>') +
            "</section>"
          );
        }

        function layoutHtml() {
          const filtered = isFiltered();
          const groups = [];
          let shown = 0;
          state.phases.forEach((phase, index) => {
            const all = tasksIn(phase.id);
            const vis = all.filter(visible);
            if (filtered && !vis.length) return;
            shown += vis.length;
            groups.push({ phase, index, all, vis });
          });

          if (filtered && !shown) {
            return (
              railHtml([]) +
              '<main><div class="empty"><p>Nothing matches this filter.</p>' +
              '<button type="button" class="btn primary" data-act="clear" data-focus="clear">Show every task</button></div></main>'
            );
          }

          let main = "<main>";
          if (filtered) {
            main +=
              '<p class="showing">Showing ' +
              shown +
              " of " +
              state.tasks.length +
              " tasks" +
              (view.q ? " matching “" + esc(view.q) + "”" : "") +
              ' <button type="button" class="linkish" data-act="clear" data-focus="clear">Clear filters</button></p>';
          }
          main += groups.map((g) => phaseHtml(g, filtered)).join("");
          if (!readOnly && !filtered)
            main +=
              '<button type="button" class="add add-phase" data-act="add-phase" data-focus="add-phase">Add a phase</button>';
          main += "</main>";
          return railHtml(groups) + main;
        }

        function footerHtml() {
          return (
            '<footer class="foot">' +
            "<p>Export Markdown to paste into docs/ROADMAP.md in the repo. Export JSON to keep a backup, and Import JSON to restore one.</p>" +
            "<p>Press <kbd>/</kbd> to search, <kbd>Esc</kbd> to clear it.</p>" +
            "</footer>"
          );
        }

        function renderLayout() {
          const el = document.getElementById("layout");
          if (el) el.innerHTML = layoutHtml();
        }

        function render(fallbackFocus) {
          const key = focusKey();
          root.innerHTML =
            headerHtml() + toolbarHtml() + '<div class="layout" id="layout">' + layoutHtml() + "</div>" + footerHtml();
          restoreFocus(key, fallbackFocus);
          justDone = null;
        }

        /* ---------- saving ---------- */

        function announce(text) {
          if (!live || !text) return;
          live.textContent = "";
          setTimeout(() => {
            live.textContent = text;
          }, 60);
        }

        function setSave(kind, text) {
          saveKind = kind;
          saveText = text || "";
          const el = document.getElementById("savestate");
          if (el) {
            el.dataset.kind = kind;
            el.textContent = saveMessage();
          }
          if (kind !== "pending" && kind !== "saving") announce(saveMessage());
        }

        function markDirty(soon) {
          dirty = true;
          if (readOnly) return;
          if (artReady && !art) {
            setSave("local");
            return;
          }
          setSave("pending");
          schedule(soon ? 400 : cadence);
        }

        function schedule(ms) {
          clearTimeout(saveTimer);
          saveTimer = setTimeout(flush, ms);
        }

        // Closing tags are assembled here, never written out literally, and no
        // closing tag may appear literally anywhere in this script — comments
        // included. One written out here would sit earlier in the document than the
        // real one at the end of the file, and any tool that injects into a page by
        // replacing the first closing body tag it finds (VS Code's Live Preview does
        // exactly this) would splice its own script block into the middle of this
        // one, ending it early and spilling the rest of the source onto the page.
        function endTag(name) {
          return "<" + "/" + name + ">";
        }

        function buildDocument(s) {
          const json = JSON.stringify(s, null, 1)
            .replace(/</g, "\\u003c")
            .replace(/\u2028/g, "\\u2028")
            .replace(/\u2029/g, "\\u2029");
          return (
            '<!doctype html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n' +
            '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n' +
            "<title>" +
            esc(s.title) +
            endTag("title") +
            "\n" +
            FONT_LINKS +
            "\n" +
            '<style id="styles">' +
            sourceCss +
            endTag("style") +
            "\n" +
            endTag("head") +
            "\n<body>\n" +
            '<div id="root" class="wrap">' +
            endTag("div") +
            "\n" +
            '<script type="application/json" id="roadmap-data">' +
            json +
            endTag("script") +
            "\n" +
            '<script id="app">' +
            sourceApp +
            endTag("script") +
            "\n" +
            endTag("body") +
            "\n" +
            endTag("html") +
            "\n"
          );
        }

        function writeView(withScroll) {
          try {
            sessionStorage.setItem(
              VIEW_KEY,
              JSON.stringify({
                status: view.status,
                area: view.area,
                q: view.q,
                scroll: withScroll ? Math.round(window.scrollY) : 0,
              })
            );
          } catch (_) {
            /* per-viewer convenience only */
          }
        }
        function readView() {
          try {
            const v = JSON.parse(sessionStorage.getItem(VIEW_KEY) || "null");
            if (!v || typeof v !== "object") return {};
            const out = {};
            if (v.status === "all" || STATUS_LABEL[v.status]) out.status = v.status;
            if (v.area === "all" || AREAS.includes(v.area)) out.area = v.area;
            if (typeof v.q === "string") out.q = v.q.slice(0, 120);
            if (typeof v.scroll === "number" && v.scroll > 0) out.scroll = v.scroll;
            return out;
          } catch (_) {
            return {};
          }
        }

        async function publishDoc(html) {
          if (filesForm !== false) {
            try {
              await art.publish({ "index.html": { content: html, contentType: "text/html" } });
              filesForm = true;
              return;
            } catch (err) {
              const code = err && err.code;
              const keep = [
                "conflict",
                "not_writer",
                "not_granted",
                "consent_required",
                "rate_limited",
                "not_declared",
                "too_large",
              ];
              if (filesForm === true || keep.includes(code)) throw err;
              filesForm = false;
            }
          }
          writeView(true);
          await art.publish(html);
        }

        async function flush() {
          if (!dirty || saving || readOnly) return;
          if (!artReady) return;
          if (!art) {
            setSave("local");
            return;
          }
          if (filesForm !== true && document.querySelector("dialog[open]")) return;
          saving = true;
          dirty = false;
          setSave("saving");
          const snap = clone(state);
          snap.updatedAt = todayISO();
          let retryIn = 0;
          try {
            await publishDoc(buildDocument(snap));
            saved = snap;
            state.updatedAt = snap.updatedAt;
            retried = false;
            const lc = document.getElementById("lastchanged");
            if (lc) lc.textContent = "Last saved " + fmtDate(saved.updatedAt);
            setSave(dirty ? "pending" : "saved");
            if (dirty) retryIn = cadence;
          } catch (err) {
            retryIn = onSaveError(err);
          } finally {
            saving = false;
            if (retryIn) schedule(retryIn);
          }
        }

        function onSaveError(err) {
          const code = err && err.code;
          if (code === "conflict") {
            setSave("conflict");
            return 0;
          }
          if (code === "not_writer" || code === "not_granted" || code === "consent_required") {
            readOnly = true;
            dirty = false;
            state = clone(saved);
            setSave("readonly");
            render();
            return 0;
          }
          dirty = true;
          if (code === "capability_disabled" || code === "capability_removed" || code === "not_declared") {
            art = null;
            setSave("local");
            return 0;
          }
          if (code === "too_large") {
            setSave("error", "The roadmap is too large to save. Shorten some notes, then save again.");
            return 0;
          }
          if (code === "rate_limited") {
            cadence = 6000;
            setSave("pending");
            return cadence;
          }
          if (!retried) {
            retried = true;
            setSave("saving");
            return 1000 + Math.round(Math.random() * 2000);
          }
          retried = false;
          setSave("error", "Couldn’t save. Your changes are still on screen, and your next edit will try again.");
          return 0;
        }

        function connect() {
          const c = window.claude;
          if (!c || typeof c.use !== "function") {
            artReady = true;
            setSave("local");
            return;
          }
          c.use("downloads").then(
            (d) => {
              dl = d || null;
            },
            () => {
              dl = null;
            }
          );
          c.use("artifact")
            .then(
              (a) => {
                art = a || null;
              },
              () => {
                art = null;
              }
            )
            .then(async () => {
              if (art) {
                try {
                  const u = await c.use("user");
                  if (u) {
                    const [canEdit, isOwner] = await Promise.all([u.canEdit(), u.isOwner()]);
                    if (canEdit === false && isOwner === false) readOnly = true;
                  }
                } catch (_) {
                  /* a refused write will decide instead */
                }
              }
              artReady = true;
              if (readOnly) {
                dirty = false;
                state = clone(saved);
                setSave("readonly");
                render();
              } else if (!art) {
                setSave("local");
              } else if (dirty) {
                flush();
              }
            });
        }

        /* ---------- actions ---------- */

        function cycle(id) {
          const t = find(id);
          if (!t) return;
          t.status = NEXT[t.status] || "todo";
          if (t.status === "done") {
            t.doneOn = todayISO();
            justDone = t.id;
          } else t.doneOn = null;
          render();
          announce(t.title + ": " + STATUS_LABEL[t.status]);
          markDirty(false);
        }

        function insertAt(t, phaseId, pos) {
          const list = tasksIn(phaseId);
          if (pos < list.length) state.tasks.splice(state.tasks.indexOf(list[pos]), 0, t);
          else if (list.length) state.tasks.splice(state.tasks.indexOf(list[list.length - 1]) + 1, 0, t);
          else state.tasks.push(t);
        }

        /* ---------- dialogs ---------- */

        function buildDialogs() {
          const holder = document.createElement("div");
          holder.innerHTML =
            '<div class="vh" aria-live="polite" id="live"></div>' +
            '<dialog id="dlg-task" aria-labelledby="dlg-task-h"><form id="f-task" novalidate>' +
            '<h2 id="dlg-task-h">Edit task</h2>' +
            '<label class="field"><span>Title</span><input name="title" maxlength="200" autocomplete="off"></label>' +
            '<p class="err" id="task-err" hidden>Give the task a title.</p>' +
            '<label class="field"><span>Why it matters</span><textarea name="why" rows="3"></textarea></label>' +
            '<fieldset class="status-pick"><legend>Status</legend>' +
            STATUSES.map(
              (s) => '<label><input type="radio" name="status" value="' + s.key + '">' + s.label + "</label>"
            ).join("") +
            "</fieldset>" +
            '<div class="grid2">' +
            '<label class="field"><span>Phase</span><select name="phase"></select></label>' +
            '<label class="field"><span>Position in phase</span><select name="pos"></select></label>' +
            '<label class="field"><span>Area</span><select name="area"><option value="">No area</option>' +
            AREAS.map((a) => '<option value="' + a + '">' + a + "</option>").join("") +
            "</select></label>" +
            '<label class="field"><span>Effort</span><input name="effort" autocomplete="off" placeholder="2–3 hrs, 0.5 day, 1–2 days"></label>' +
            "</div>" +
            '<label class="field"><span>Source</span><input name="source" autocomplete="off" placeholder="Audit, Your roadmap #3"></label>' +
            '<label class="field"><span>Link</span><input name="link" type="url" autocomplete="off" placeholder="https://github.com/AustinCoders/groundwork/pull/…"></label>' +
            '<label class="field"><span>Notes</span><textarea name="notes" rows="3" placeholder="Shows on the roadmap as a handwritten note"></textarea></label>' +
            '<div class="dlg-actions">' +
            '<button type="button" class="btn danger" data-dlg="delete">Delete task</button>' +
            '<span class="grow"></span>' +
            '<button type="button" class="btn" data-dlg="cancel">Cancel</button>' +
            '<button type="submit" class="btn primary">Save task</button>' +
            "</div>" +
            "</form></dialog>" +
            '<dialog id="dlg-phase" aria-labelledby="dlg-phase-h"><form id="f-phase" novalidate>' +
            '<h2 id="dlg-phase-h">Edit phase</h2>' +
            '<label class="field"><span>Name</span><input name="name" maxlength="120" autocomplete="off"></label>' +
            '<p class="err" id="phase-err" hidden>Give the phase a name.</p>' +
            '<label class="field"><span>Note</span><textarea name="note" rows="2" placeholder="When it happens, or what ties these tasks together"></textarea></label>' +
            '<label class="field"><span>Position</span><select name="pos"></select></label>' +
            '<p class="hint" id="phase-hint" hidden>To delete this phase, move or delete its tasks first.</p>' +
            '<div class="dlg-actions">' +
            '<button type="button" class="btn danger" data-dlg="delete">Delete phase</button>' +
            '<span class="grow"></span>' +
            '<button type="button" class="btn" data-dlg="cancel">Cancel</button>' +
            '<button type="submit" class="btn primary">Save phase</button>' +
            "</div>" +
            "</form></dialog>" +
            '<dialog id="dlg-text" aria-labelledby="dlg-text-h"><form id="f-text" novalidate>' +
            '<h2 id="dlg-text-h"></h2>' +
            '<p class="hint" id="text-desc" style="margin:-0.7rem 0 0.9rem"></p>' +
            '<label class="field"><span class="vh" id="text-label"></span><textarea name="body" rows="12" class="code" spellcheck="false" aria-labelledby="text-label"></textarea></label>' +
            '<p class="err" id="text-err" hidden></p>' +
            '<div class="dlg-actions" id="text-actions"></div>' +
            "</form></dialog>";
          while (holder.firstChild) document.body.appendChild(holder.firstChild);

          live = document.getElementById("live");
          dlgTask = document.getElementById("dlg-task");
          fTask = document.getElementById("f-task");
          dlgPhase = document.getElementById("dlg-phase");
          fPhase = document.getElementById("f-phase");
          dlgText = document.getElementById("dlg-text");
          fText = document.getElementById("f-text");

          [dlgTask, dlgPhase, dlgText].forEach((d) => {
            d.addEventListener("close", () => {
              restoreFocus(returnFocus, "add-phase");
              if (dirty && !readOnly) schedule(400);
            });
          });

          fTask.addEventListener("submit", (e) => {
            e.preventDefault();
            saveTask();
          });
          fTask.elements.namedItem("phase").addEventListener("change", (e) => fillTaskPos(e.target.value));
          fTask.addEventListener("click", (e) => {
            const b = e.target.closest("[data-dlg]");
            if (!b) return;
            if (b.dataset.dlg === "cancel") closeDialog(dlgTask);
            if (b.dataset.dlg === "delete") deleteTask(b);
          });

          fPhase.addEventListener("submit", (e) => {
            e.preventDefault();
            savePhase();
          });
          fPhase.addEventListener("click", (e) => {
            const b = e.target.closest("[data-dlg]");
            if (!b) return;
            if (b.dataset.dlg === "cancel") closeDialog(dlgPhase);
            if (b.dataset.dlg === "delete") deletePhase(b);
          });

          fText.addEventListener("submit", (e) => {
            e.preventDefault();
            if (textMode === "import") applyImport();
          });
        }

        function openDialog(d) {
          if (typeof d.showModal === "function") d.showModal();
          else d.setAttribute("open", "");
        }
        function closeDialog(d) {
          if (typeof d.close === "function" && d.open) d.close();
          else {
            d.removeAttribute("open");
            d.dispatchEvent(new Event("close"));
          }
        }
        function field(form, name) {
          return form.elements.namedItem(name);
        }
        function armReset(btn, label) {
          btn.dataset.armed = "";
          btn.textContent = label;
        }

        function openTask(id, phaseId) {
          const t = id ? find(id) : null;
          editing = { id: t ? t.id : null };
          returnFocus = focusKey();
          fTask.reset();
          document.getElementById("dlg-task-h").textContent = t ? "Edit task" : "New task";
          document.getElementById("task-err").hidden = true;
          field(fTask, "title").value = t ? t.title : "";
          field(fTask, "why").value = t ? t.why : "";
          const st = t ? t.status : "todo";
          fTask.querySelectorAll('input[name="status"]').forEach((r) => {
            r.checked = r.value === st;
          });
          const phaseSel = field(fTask, "phase");
          phaseSel.innerHTML = state.phases
            .map((p) => '<option value="' + esc(p.id) + '">' + esc(p.name) + "</option>")
            .join("");
          phaseSel.value = t ? t.phase : phaseId || state.phases[0].id;
          fillTaskPos(phaseSel.value);
          const areaSel = field(fTask, "area");
          if (t && t.area && !AREAS.includes(t.area)) {
            const o = document.createElement("option");
            o.value = t.area;
            o.textContent = t.area;
            areaSel.appendChild(o);
          }
          areaSel.value = t ? t.area : "";
          field(fTask, "effort").value = t ? t.effort : "";
          field(fTask, "source").value = t ? t.source : "";
          field(fTask, "link").value = t ? t.link : "";
          field(fTask, "notes").value = t ? t.notes : "";
          const del = fTask.querySelector('[data-dlg="delete"]');
          del.hidden = !t;
          armReset(del, "Delete task");
          openDialog(dlgTask);
          field(fTask, "title").focus();
        }

        function fillTaskPos(phaseId) {
          const others = tasksIn(phaseId).filter((x) => !editing || x.id !== editing.id);
          const n = others.length + 1;
          const sel = field(fTask, "pos");
          let html = "";
          for (let i = 0; i < n; i++)
            html += '<option value="' + i + '">' + (i + 1) + (i === n - 1 && n > 1 ? " (last)" : "") + "</option>";
          sel.innerHTML = html;
          const cur = editing && editing.id ? find(editing.id) : null;
          sel.value = String(cur && cur.phase === phaseId ? tasksIn(phaseId).indexOf(cur) : n - 1);
        }

        function saveTask() {
          const title = field(fTask, "title").value.trim();
          if (!title) {
            document.getElementById("task-err").hidden = false;
            field(fTask, "title").focus();
            return;
          }
          let t = editing.id ? find(editing.id) : null;
          const wasDone = !!(t && t.status === "done");
          if (t) state.tasks.splice(state.tasks.indexOf(t), 1);
          else t = { id: uid("t"), doneOn: null };
          const checked = fTask.querySelector('input[name="status"]:checked');
          let link = field(fTask, "link").value.trim();
          if (link && !/^https?:\/\//i.test(link)) link = "https://" + link;
          t.title = title;
          t.why = field(fTask, "why").value.trim();
          t.status = checked ? checked.value : "todo";
          t.effort = field(fTask, "effort").value.trim();
          t.area = field(fTask, "area").value;
          t.source = field(fTask, "source").value.trim();
          t.link = safeLink(link.replace(/\s+/g, ""));
          t.notes = field(fTask, "notes").value.trim();
          if (t.status === "done") {
            if (!wasDone) {
              t.doneOn = todayISO();
              justDone = t.id;
            }
          } else t.doneOn = null;
          t.phase = field(fTask, "phase").value;
          insertAt(t, t.phase, parseInt(field(fTask, "pos").value, 10) || 0);
          returnFocus = "title:" + t.id;
          closeDialog(dlgTask);
          render("title:" + t.id);
          announce(editing.id ? "Task saved" : "Task added");
          markDirty(true);
        }

        function deleteTask(btn) {
          if (btn.dataset.armed !== "1") {
            btn.dataset.armed = "1";
            btn.textContent = "Click again to delete";
            return;
          }
          const t = find(editing.id);
          if (!t) return;
          state.tasks.splice(state.tasks.indexOf(t), 1);
          returnFocus = "add:" + t.phase;
          closeDialog(dlgTask);
          render(returnFocus);
          announce("Task deleted");
          markDirty(true);
        }

        function openPhase(id) {
          const p = id ? state.phases.find((x) => x.id === id) : null;
          editingPhase = { id: p ? p.id : null };
          returnFocus = focusKey();
          fPhase.reset();
          document.getElementById("dlg-phase-h").textContent = p ? "Edit phase" : "New phase";
          document.getElementById("phase-err").hidden = true;
          field(fPhase, "name").value = p ? p.name : "";
          field(fPhase, "note").value = p ? p.note : "";
          const n = state.phases.length + (p ? 0 : 1);
          const sel = field(fPhase, "pos");
          let html = "";
          for (let i = 0; i < n; i++)
            html += '<option value="' + i + '">' + (i + 1) + (i === n - 1 && n > 1 ? " (last)" : "") + "</option>";
          sel.innerHTML = html;
          sel.value = String(p ? state.phases.indexOf(p) : n - 1);
          const del = fPhase.querySelector('[data-dlg="delete"]');
          const hasTasks = p ? tasksIn(p.id).length > 0 : false;
          del.hidden = !p;
          del.disabled = hasTasks || state.phases.length < 2;
          armReset(del, "Delete phase");
          const hint = document.getElementById("phase-hint");
          hint.hidden = !(p && hasTasks);
          openDialog(dlgPhase);
          field(fPhase, "name").focus();
        }

        function savePhase() {
          const name = field(fPhase, "name").value.trim();
          if (!name) {
            document.getElementById("phase-err").hidden = false;
            field(fPhase, "name").focus();
            return;
          }
          let p = editingPhase.id ? state.phases.find((x) => x.id === editingPhase.id) : null;
          if (p) state.phases.splice(state.phases.indexOf(p), 1);
          else p = { id: uid("p") };
          p.name = name;
          p.note = field(fPhase, "note").value.trim();
          const pos = Math.min(parseInt(field(fPhase, "pos").value, 10) || 0, state.phases.length);
          state.phases.splice(pos, 0, p);
          returnFocus = "phase:" + p.id;
          closeDialog(dlgPhase);
          render("phase:" + p.id);
          announce(editingPhase.id ? "Phase saved" : "Phase added");
          markDirty(true);
        }

        function deletePhase(btn) {
          if (btn.disabled) return;
          if (btn.dataset.armed !== "1") {
            btn.dataset.armed = "1";
            btn.textContent = "Click again to delete";
            return;
          }
          const p = state.phases.find((x) => x.id === editingPhase.id);
          if (!p || tasksIn(p.id).length || state.phases.length < 2) return;
          state.phases.splice(state.phases.indexOf(p), 1);
          returnFocus = "add-phase";
          closeDialog(dlgPhase);
          render("add-phase");
          announce("Phase deleted");
          markDirty(true);
        }

        function openText(opts) {
          textMode = opts.mode;
          returnFocus = focusKey();
          document.getElementById("dlg-text-h").textContent = opts.title;
          document.getElementById("text-desc").textContent = opts.desc;
          document.getElementById("text-label").textContent = opts.title;
          const err = document.getElementById("text-err");
          err.hidden = true;
          const ta = field(fText, "body");
          ta.value = opts.value || "";
          ta.readOnly = !!opts.readOnly;
          const actions = document.getElementById("text-actions");
          actions.innerHTML = "";
          opts.actions.forEach((a) => {
            const b = document.createElement("button");
            b.type = a.submit ? "submit" : "button";
            b.className = "btn" + (a.primary ? " primary" : "");
            b.textContent = a.label;
            if (a.grow) {
              const g = document.createElement("span");
              g.className = "grow";
              actions.appendChild(g);
            }
            if (a.onClick) b.addEventListener("click", () => a.onClick(b, ta));
            actions.appendChild(b);
          });
          openDialog(dlgText);
          if (opts.readOnly) {
            ta.focus();
            ta.select();
          } else ta.focus();
        }

        async function copyText(ta, btn) {
          let ok = false;
          try {
            await navigator.clipboard.writeText(ta.value);
            ok = true;
          } catch (_) {
            /* fall back */
          }
          if (!ok) {
            try {
              ta.focus();
              ta.select();
              ok = document.execCommand("copy");
            } catch (_) {
              ok = false;
            }
          }
          btn.textContent = ok ? "Copied" : "Press Ctrl+C or ⌘C to copy";
          if (!ok) {
            ta.focus();
            ta.select();
          }
          setTimeout(() => {
            btn.textContent = "Copy";
          }, 2200);
        }

        async function offerDownload(filename, data, btn) {
          if (!dl) return false;
          try {
            await dl.save({ filename, data });
            announce(filename + " saved");
            return true;
          } catch (err) {
            const code = err && err.code;
            if (code === "declined") return true;
            if (code === "rate_limited") {
              announce("A save prompt is already open.");
              return true;
            }
            if (btn) btn.hidden = true;
            dl = null;
            return false;
          }
        }

        function toMarkdown() {
          const cell = (v) =>
            String(v || "")
              .replace(/\|/g, "\\|")
              .replace(/\s*\n\s*/g, " ");
          const t = totals(state.tasks);
          let out =
            "# " +
            state.title +
            "\n\nUpdated " +
            fmtDate(state.updatedAt) +
            ". " +
            t.done +
            " of " +
            t.total +
            " done.\n";
          state.phases.forEach((p, i) => {
            const list = tasksIn(p.id);
            out += "\n## " + (i + 1) + ". " + p.name + "\n\n";
            if (p.note) out += p.note + "\n\n";
            if (!list.length) {
              out += "_No tasks yet._\n";
              return;
            }
            out += "| # | Item | Effort | Status | Why |\n| --- | --- | --- | --- | --- |\n";
            list.forEach((x, j) => {
              const status = STATUS_LABEL[x.status] + (x.doneOn ? " " + fmtShort(x.doneOn) : "");
              const item = cell(x.title) + (x.link ? " ([" + cell(linkLabel(x.link)) + "](" + x.link + "))" : "");
              const why = cell(x.why) + (x.notes ? " _Note: " + cell(x.notes) + "_" : "");
              out += "| " + (j + 1) + " | " + item + " | " + cell(x.effort) + " | " + status + " | " + why + " |\n";
            });
          });
          return out;
        }

        function openMarkdown() {
          const md = toMarkdown();
          const actions = [{ label: "Copy", primary: true, onClick: (b, ta) => copyText(ta, b) }];
          if (dl) actions.push({ label: "Download .md", onClick: (b) => offerDownload("ROADMAP.md", md, b) });
          actions.push({ label: "Close", grow: true, onClick: () => closeDialog(dlgText) });
          openText({
            mode: "md",
            title: "Markdown export",
            desc: "Paste this over docs/ROADMAP.md in the repo.",
            value: md,
            readOnly: true,
            actions,
          });
        }

        async function exportJson(btn) {
          const json = JSON.stringify(state, null, 2);
          const done = await offerDownload("groundwork-roadmap.json", json, null);
          if (done) return;
          openText({
            mode: "json",
            title: "JSON export",
            desc: "Downloads aren’t available here, so copy this and keep it somewhere safe. Import JSON restores it.",
            value: json,
            readOnly: true,
            actions: [
              { label: "Copy", primary: true, onClick: (b, ta) => copyText(ta, b) },
              { label: "Close", grow: true, onClick: () => closeDialog(dlgText) },
            ],
          });
          void btn;
        }

        function openImport() {
          openText({
            mode: "import",
            title: "Import JSON",
            desc: "Paste an export from this page. It replaces the whole roadmap.",
            value: "",
            readOnly: false,
            actions: [
              { label: "Cancel", grow: true, onClick: () => closeDialog(dlgText) },
              { label: "Replace roadmap", primary: true, submit: true },
            ],
          });
        }

        function applyImport() {
          const err = document.getElementById("text-err");
          const text = field(fText, "body").value.trim();
          let parsed = null;
          try {
            parsed = JSON.parse(text);
          } catch (_) {
            parsed = null;
          }
          if (!parsed) {
            err.textContent = "That isn’t valid JSON. Paste the full text from Export JSON.";
            err.hidden = false;
            return;
          }
          if (!Array.isArray(parsed.phases) || !Array.isArray(parsed.tasks)) {
            err.textContent = "That JSON isn’t a roadmap export. It needs a list of phases and a list of tasks.";
            err.hidden = false;
            return;
          }
          state = normalize(parsed);
          view.status = "all";
          view.area = "all";
          view.q = "";
          writeView(false);
          returnFocus = "import";
          closeDialog(dlgText);
          render("import");
          announce("Roadmap imported: " + plural(state.tasks.length, "task"));
          markDirty(true);
        }

        /* ---------- events ---------- */

        function onClick(e) {
          const b = e.target.closest("[data-act]");
          if (!b || !root.contains(b) || b.tagName === "SELECT" || b.tagName === "INPUT") return;
          const act = b.dataset.act;
          if (act === "cycle" && !readOnly) cycle(b.dataset.id);
          else if (act === "edit" && !readOnly) openTask(b.dataset.id);
          else if (act === "add" && !readOnly) openTask(null, b.dataset.phase);
          else if (act === "phase" && !readOnly) openPhase(b.dataset.id);
          else if (act === "add-phase" && !readOnly) openPhase(null);
          else if (act === "filter") {
            view.status = b.dataset.val;
            writeView(false);
            render();
          } else if (act === "clear") {
            view.status = "all";
            view.area = "all";
            view.q = "";
            writeView(false);
            render("filter:all");
          } else if (act === "md") openMarkdown();
          else if (act === "json") exportJson(b);
          else if (act === "import" && !readOnly) openImport();
        }

        function onChange(e) {
          const s = e.target;
          if (s.dataset && s.dataset.act === "area") {
            view.area = s.value;
            writeView(false);
            render();
          }
        }

        function onInput(e) {
          const el = e.target;
          if (!el.dataset || el.dataset.act !== "search") return;
          view.q = el.value.trim().slice(0, 120);
          writeView(false);
          clearTimeout(searchTimer);
          searchTimer = setTimeout(renderLayout, 120);
        }

        function onKeyDown(e) {
          const el = document.activeElement;
          const inField = el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA" || el.tagName === "SELECT");
          if (e.key === "/" && !inField && !e.metaKey && !e.ctrlKey && !e.altKey) {
            const q = root.querySelector('[data-act="search"]');
            if (q) {
              e.preventDefault();
              q.focus();
              q.select();
            }
            return;
          }
          if (e.key === "Escape" && el && el.dataset && el.dataset.act === "search" && view.q) {
            e.stopPropagation();
            el.value = "";
            view.q = "";
            writeView(false);
            renderLayout();
          }
        }

        function init() {
          buildDialogs();
          render();
          if (view.scroll) {
            const y = view.scroll;
            requestAnimationFrame(() => window.scrollTo(0, y));
            view.scroll = 0;
            writeView(false);
          }
          root.addEventListener("click", onClick);
          root.addEventListener("change", onChange);
          root.addEventListener("input", onInput);
          document.addEventListener("keydown", onKeyDown);
          connect();
        }

        init();
      })();
    </script>
  </body>
</html>
