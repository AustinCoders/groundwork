[[entry]]
id = 6
type = "story"
title = "TP-5 · A real page for unwritten topics"
description = "Renders a server-side TopicOutline on outline covers (roadmap by level, Meanwhile from entry 5's lib/topicRelated.ts, curriculum notes), redirects /soon?topic=, /level/<outline> and /path?topic=<outline> to it with next.config redirects matched on the query so the target stays static, points navHref, the home page and the menu at it, and updates tests/seo.test.ts and the How this is built chapters on coming-soon routing (arch-coming-soon.ts, arch-routes.ts, arch-state.ts)."
verify = "curl -sL on /soon?topic=typescript, /level/typescript and /path?topic=typescript each ends on /typescript with the roadmap in the HTML; the home page's Being written next link for TypeScript lands there; no page shows 0 / 0 or 0 min; the sitemap still omits outline covers; the seo and claims tests pass."
covers = ["CAP-4"]
after = [2, 4, 5]
hitl = false
risk = "medium"
unknown = "Whether next.config redirects with a query match cover every old /soon link, and whether any external link depends on /soon rendering."
references = ["_bmad-output/planning-artifacts/audit-2026-09-28/topics.md#e-outline-topic-landing-replaces-soon"]

