title = "TP-4 · Unwritten chapters and the loading skeleton"
description = "Gives outline chapters the reader layout with a roadmap card of what the chapter will cover, Meanwhile links to written chapters and interview rounds from a new lib/topicRelated.ts that entry 6 reuses, and prev and next among outline chapters, and restyles ChapterSkeleton to the new grid."
verify = "/typescript/ts-setup-compiler shows its items, Meanwhile links and prev and next, keeps noindex, and a throttled navigation between two chapters shows no layout jump from skeleton to page."
covers = ["CAP-3", "CAP-4"]
after = [3, 4]
