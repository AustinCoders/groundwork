[[entry]]
id = 1
type = "story"
title = "TP-1 · Topic frame and shared reader parts (tracer)"
description = "Adds the optional topic props to PageFrame (back, titleHref, mark and accent, actions, reading, layout, skipHref) with a thin TopicFrame that epic 4 later converges the rest of the site on; extracts ChapterRail, TocCard, ChapterEnd, ChapterPager, ChaptersSheet (keeping epic 1 entry 2's focus handling), useActiveHeading, useChapterKeys and DiagramDefs for entry 3, and PartSection and ChapterCard for entries 4 and 9; and, as the tracer, renders only the /notes cover's existing content inside TopicFrame (the other 17 covers stay on Shell until entry 4), adding /notes to the head-back e2e loop."
verify = "/notes shows the labelled back pill, menu and JavaScript title with its current cover content and passes the a11y spec; /review, /progress, /git and /architecture look unchanged in before-and-after screenshots; the architecture, git, keyboard and head-back e2e tests pass."
covers = ["CAP-3", "CAP-8"]
after = ["1.2", "1.3"]
hitl = false
risk = "medium"
unknown = "Whether the series CSS modules split cleanly enough that git and architecture stay pixel-identical."
references = ["_bmad-output/planning-artifacts/audit-2026-09-28/topics.md#32-shared-frame-topicframe", "_bmad-output/planning-artifacts/audit-2026-09-28/topics.md#34-component-reuse-plan"]

[[entry]]
id = 2
type = "story"
title = "TP-0 · Topic routing and data fixes"
description = "Bases outline state on the written count instead of status so /soon?topic= stays on /soon and lists the topic's syllabus sections from content/topics.ts instead of bouncing to a level picker, fixes the stale /soon copy (handed over from epic 1 entry 4), limits the /path sidebar to the current topic, sets dynamicParams false on the 18 topic chapter routes and on /architecture/[chapter] so unknown slugs 404, counts zero minutes for unwritten chapters, adds a 404-status smoke test and a vitest for the minutes, and updates arch-request-path.ts, arch-routes.ts and arch-content-model.ts where they describe these behaviours."
verify = "/soon?topic=typescript renders the TypeScript syllabus without redirecting, the /path?topic=js sidebar lists 41 chapters, curl -w '%{http_code}' on /notes/nope and /architecture/nope prints 404, /level/typescript shows no minutes, and the seo, claims, sitemap and new tests pass."
covers = ["CAP-4"]
after = ["1.4", "1.5"]
hitl = false
risk = "low"
unknown = "Whether topicStats or claims figures move when unwritten chapters count zero minutes; if epic 1 entry 8 lands first, rebase on its claims test."
references = ["_bmad-output/planning-artifacts/audit-2026-09-28/topics.md#17-bugs-found-while-auditing"]

[[entry]]
id = 3
type = "story"
title = "TP-3 · Chapter reader: rail, readable column, contents"
description = "Renders every written chapter in TopicFrame's reader layout with entry 1's rail (search ported in, level folds, read ticks), a ≤760px article with h3 ids and an on-page contents, a header pager and the chapter keys, a restyled practice block, an end card with Mark as read and the review hint, text size, narrator and print moved into the site menu with print CSS re-targeted to the article, the playground e2e test moved to the menu's Playground link, the chapters added to the a11y spec and head-back loop, and arch-search.ts and arch-rendering.ts rewritten for the new reader."
verify = "At 1440 a chapter paragraph is at most 760px wide and every h3 is linked from the contents; at 390 the text column is at least 350px and the Chapters sheet opens; the keys [ ] n p t work; printing prints only the article; marking a chapter read brings it back on /review after the first gap; the narration, React and DSA demo, search, playground and head-back e2e tests pass; a11y on /notes/setup-mental-model passes in light and dark at 1440 and 390."
covers = ["CAP-3"]
after = [1]
hitl = false
risk = "high"
unknown = "How Lenis smooth scrolling interacts with the drag and slider demos, and which selectors narration's SPEECH_EXCLUDE needs for the new end and practice blocks."
references = ["_bmad-output/planning-artifacts/audit-2026-09-28/topics.md#b-chapter-reader-written-chapter", "_bmad-output/planning-artifacts/audit-2026-09-28/topics.md#35-must-not-regress-acceptance-checklist-for-every-story"]

[[entry]]
id = 4
type = "story"
title = "TP-2 · Topic cover as a landing page"
description = "Replaces the cover for the four written topics with a hero and Continue action, an Up next card holding the reading-time picker (a useReadingPlan hook lifted from CoverMap), and chapters grouped by level as entry 1's PartSection and ChapterCard with subtitles, minutes, exercise counts and read ticks, keeping HashRedirect and a static layout under reduced motion, and adds the four covers to the a11y spec and head-back loop."
verify = "The #main h1 on /notes contains JavaScript, a card's read tick updates the read count, Continue opens the first unread chapter, the first chapter card is above the fold at 1440x900, there is no horizontal scroll at 375, a11y on the four covers passes, and the spec's three-tap phone walk (open /notes, Continue, reach a Closures section from its contents) works at 390."
covers = ["CAP-3"]
after = [1, 3]
hitl = false
risk = "medium"
unknown = "Whether the station tick e2e selectors move with the new cards or the test is updated."
references = ["_bmad-output/planning-artifacts/audit-2026-09-28/topics.md#a-topic-cover--landing-written-topics"]

