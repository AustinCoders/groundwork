[[entry]]
id = 8
type = "story"
title = "TP-7 · Path page, rendered on the server"
description = "Moves the path onto TopicFrame with its steps in server HTML via static per-topic and per-level segments (never request-time searchParams), redirects old /path?topic=&level= links, re-points LevelView's links, navHref and the smoke and a11y URLs, sends only this topic's chapter data, collapses exercises except for the next step, keeps one primary action, moves Reset progress to a low-emphasis foot with confirmation, adds the path to the head-back loop, and updates the /path row in arch-routes.ts."
verify = "The server HTML for the JavaScript beginner path contains the step titles and a heading with Beginner; the old /path?topic=js&level=beginner URL redirects there; the build lists no new dynamic route; the path payload is near 30 KB instead of 365 KB; Reset still asks and clears progress; a11y on the path passes."
covers = ["CAP-3", "CAP-5"]
after = [1, 6, 7]
hitl = false
risk = "medium"
unknown = "How saved progress hydrates over server-rendered steps without a flash."

