description = "Moves every action, link, progress, selection and highlight in home.module.css, review.module.css, progress.module.css, book.module.css (dropping its red --primary), mock.module.css, guide.module.css, frame.module.css, SiteDrawer.module.css and Modal.module.css onto the role tokens from entry 1, keeping pass, fail, due and tip on the state tokens."
