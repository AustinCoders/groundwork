[[entry]]
id = 1
type = "story"
title = "Review asks a DSA chapter's check questions"
description = "Makes a due chapter of a quiz-completion topic in /review ask two of its check questions through 3.1's lazy per-chapter import and keeps its review gap in groundwork:quiz (both right moves it to the next gap, one right makes it due again after the same gap counted from now, both wrong steps it back one gap), so the reviews count in jsnotes:progress only ever grows and XP never falls, falling back to self-rating when a chapter has fewer than two questions, showing not checked on the review page, and leaving markReviewed, dueAt and REVIEW_GAPS_DAYS untouched, and saves the ids of the questions the reader answered wrong in the review result in groundwork:quiz for 7.7's shaky list to read."
verify = "With seeded due chapters /review asks two binary-search questions and moves its due date by the rule for two, one and no right answers while XP never falls, a wrong answer's question id is saved in the review result in groundwork:quiz, a due /notes chapter still shows self-rating, and a vitest pins a non-DSA chapter's schedule as before."
covers = ["X1", "X5"]
after = ["3.2"]
hitl = false
risk = "medium"

[[entry]]
id = 2
type = "story"
title = "Which-pattern drill"
description = "Adds a /dsa/patterns drill that mixes the pattern-tagged recognise questions from the reader's done or tested-out DSA chapters, asks for the pattern, explains each answer, points a reader with no done chapter to the placement, and adds the route to How this is built."
verify = "With seeded done chapters from all three levels the drill mixes their questions and explains each answer, with none done it points to the placement, and axe passes on it in all nine themes."
covers = ["X2"]
after = ["6.8", "3.7"]
hitl = false
risk = "low"

[[entry]]
id = 3
type = "story"
title = "DSA cheat sheet"
description = "Adds one page per pattern at /dsa/cheat-sheet/<pattern> built from the chapters' pattern records, each with its signals, template and complexity and links to its chapter and to its player's anchor, plus an index page at /dsa/cheat-sheet listing every pattern grouped by level, and adds both routes to How this is built."
verify = "Every pattern has its own /dsa/cheat-sheet/<pattern> page linking to a chapter and a player anchor that exist, the index lists every pattern, a test fails when a pattern record has no chapter, and axe passes on the index and a pattern page in all nine themes."
covers = ["X3"]
after = ["6.8", 2]
hitl = false
risk = "low"

[[entry]]
id = 7
type = "story"
title = "Shaky list on /review"
description = "Adds a shaky list that reads the ids of questions missed in checks (3.2's store), in the complexity round (3.10's round result) and in review (7.1's review result), removes a question when the reader later answers it right in any of them, and shows the list on /review with a link to each question's chapter section, listing the fields it adds to groundwork:quiz in How this is built."
verify = "With a real wrong answer given in a binary-search check, in its complexity round and in a due review, /review lists those questions each linking to its chapter section, answering one right later removes it, and nothing is written to jsnotes:progress."
covers = ["X5"]
after = [1, "3.2", "3.10"]
hitl = false
risk = "medium"

[[entry]]
id = 8
type = "story"
title = "Revision list by interview style and pattern"
description = "Adds a revision list on /dsa that groups the reader's done chapters, shaky questions and the site's existing exercises by interview style (online assessment, phone screen, onsite round) and by pattern using the style tags in each chapter's pattern record, each exercise taking the style and pattern of its chapter, names no companies, works from local data only with no network call, and adds the list to How this is built."
verify = "With seeded done chapters, shaky questions and an exercise the list groups them under each style and pattern, no company name appears anywhere in it or in the style tags, it renders with the network blocked, and axe passes on it in all nine themes."
covers = ["X6"]
after = [7, "6.8", "3.1"]
hitl = false
risk = "medium"

[[entry]]
id = 4
type = "story"
title = "Refactor sweep"
description = "Cleans up what entries 1 to 3, 7, 8 and their reviews deferred, scoped from their build records when it starts, and takes cleanup only."
verify = "npm run check, npm run build and npm run test:e2e pass, and every finding this epic deferred is fixed or moved to a named later entry."
covers = ["X1", "X2", "X3", "X5", "X6"]
after = [1, 2, 3, 7, 8]
hitl = false
risk = "low"

[[entry]]
id = 5
type = "story"
title = "Release gate: completeness, nine themes and the phone walk"
description = "Adds a completeness test (42 written chapters, an empty allow-list, a pool of at least 8 with 2 placement-tagged and at least 2 complexity questions, at least one puzzle and a player for every chapter, and a style tag on every pattern record), the success-signal walk as a 390px e2e test that includes the end-of-chapter popup, solving a puzzle, seeing a missed question on the shaky list in /review, the revision list, Revise earlier for a placed reader, the First check passed badge and Try your own input rejecting a bad input with its reason, axe under reduced motion on every DSA page type in all nine themes at 1440 and 390, a seeded legacy-progress check that marks, XP, badges and due dates are unchanged and a check that no non-DSA e2e expectation changed, the overhaul's must-not-regress checklist (topics.md §3.5) on /dsa and a chapter at each level, and brings How this is built, the DSA topic copy, the sitemap, docs/roadmap.html (with its artifact republished) and docs/ROADMAP.md in line with the release."
verify = "The completeness test (puzzle, two complexity questions and style tags per chapter), the walk with the popup, a puzzle, the shaky list, the revision list, Revise earlier, the badge and Try your own input, the nine-theme axe run and the legacy-progress check pass, the claims and seo tests pass, and npm run check, build and test:e2e pass on feature/dsa-rebuild."
covers = ["X4"]
after = [4, "1.5", "2.7", "3.8"]
hitl = false
risk = "medium"
unknown = "The description is large, so if it does not fit one session the split point is the tests and the phone walk first, and the docs, roadmap and artifact republish second, as a new appended entry."

[[entry]]
id = 6
type = "story"
title = "Merge and production check"
description = "When the user says merge, rebases feature/dsa-rebuild on main if main has moved, reruns the full gate, fast-forwards main, pushes origin, deletes the branch locally and on GitHub, and runs the success-signal walk against production."
verify = "main points at the release commit, the branch is gone locally and on GitHub, and on production the walk passes and /dsa/patterns, /dsa/cheat-sheet and a DSA review question load."
covers = ["X4"]
after = [5]
hitl = true
risk = "medium"
