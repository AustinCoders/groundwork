[[entry]]
id = 4
type = "story"
title = "Check states on the rail, cover and path"
description = "Makes 1.3's completion policy report checked (only while the read mark exists), not checked, read before checks and tested out (from 3.3's store) in text on the DSA rail, Chapters sheet, cover cards, read counts and path steps."
verify = "With a seeded mix of passed, marked-anyway, old and tested-out chapters, each surface shows each state in text, and the Git, How this is built and /path?topic=js tick tests pass unchanged."
covers = ["C3"]
after = []
hitl = false
risk = "medium"

[[entry]]
id = 5
type = "story"
title = "Generated trace questions"
description = "Owns turning a tracer frame into a what-happens-next or state-after-step-k choice, and lets each chapter's tracers generate such questions from their presets to join its draw, with a seeded draw for tests."
verify = "Binary search's pool includes generated questions whose answers match the tracer's frames in vitest, and a seeded draw includes at least one."
covers = ["C4"]
after = []
hitl = false
risk = "medium"
unknown = "Whether questions are generated in the server loader or in the browser from the lazily loaded tracer; the builder decides by payload size."

[[entry]]
id = 6
type = "story"
title = "Predict the next step in the player"
description = "Adds an optional predict mode to the Player that asks, with 3.2's ChoiceList and 3.5's frame-to-choice step, what the next frame will be before revealing it."
verify = "On /dsa/dsa-binary-search a keyboard user turns on predict mode, answers before each reveal and sees right or wrong in text, and axe passes on the player in predict mode in all nine themes."
covers = ["C5"]
after = [5, "2.6"]
hitl = false
risk = "medium"

[[entry]]
id = 7
type = "story"
title = "Placement flow, plan and Re-check"
description = "Shows the three doors (start from the beginning, find my level, pick a level) to first-time readers on /dsa and /level/dsa through a Topic field rather than a topic id, runs the placement on a static, noindexed /dsa/placement route with no timer and at most 18 questions, shows the level and plan without a raw score, lists chapters below the reader's level under Revise earlier on the plan and result screen with nothing locked, puts the plan in the cover aside with Continue, makes 1.3's next-chapter hook follow the plan so Continue, Up next and the path's next step skip tested-out chapters, offers retake and a reset that clears only the placement key, gives readers with DSA marks Re-check my level, stops level cards and the path writing jsnotes:level for quiz topics, and adds the routes to How this is built."
verify = "An e2e test with a fixture bank takes the placement as a first-time reader, lands on the plan, sees Continue open the first allotted chapter, and finds jsnotes:progress, jsnotes:activity and jsnotes:level byte-identical; a placed reader sees chapters below their level under Revise earlier and can open and mark one done; a reader with marks sees Re-check my level; axe passes on the placement and result screens in all nine themes."
covers = ["C7"]
after = [4]
hitl = false
risk = "medium"
unknown = "Only binary search has a pool until the level epics run, so the routing stage cannot fill from real content yet; the e2e uses a fixture bank. The description is large, so if it does not fit one session the split point is the placement flow and plan first, and the three doors and Re-check second."

[[entry]]
id = 9
type = "story"
title = "End-of-chapter popup: Mark this chapter done?"
description = "Adds a focus-trapped modal dialog on the chapter page that opens once when the reader reaches the end card of a chapter that is not done and asks Mark this chapter done?, where Yes scrolls to and opens the check at #check and Not yet closes it and records the dismissal for that chapter in groundwork:quiz for good, using 3.4's checked and not-checked states to know a chapter is done and never opening mid-reading, and listing the fields it adds to groundwork:quiz in How this is built."
verify = "On /dsa/dsa-binary-search a keyboard user scrolling to the end card of a not-done chapter sees the popup open once, Yes opens the check, Not yet never brings it back for that chapter after a reload, Escape closes it and returns focus to where it was, and it never opens on a done chapter or when arriving at #check, with axe passing on the popup in all nine themes."
covers = ["C8"]
after = [4]
hitl = false
risk = "medium"
unknown = "Whether the end card is detected with an IntersectionObserver or a sentinel element; the builder picks the one that stays quiet under reduced motion and when jumping straight to the end."

[[entry]]
id = 10
type = "story"
title = "Complexity round at the end of a chapter"
description = "Adds an optional round of 2 questions with skill complexity on a code sample from the chapter to its end card, reusing 3.2's ChoiceList, showing every explanation, never blocking mark done or counting toward the pass, keeping the last round result in groundwork:quiz with the ids of the questions answered wrong, which 7.7's shaky list reads, and listing the fields it adds to groundwork:quiz in How this is built."
verify = "On /dsa/dsa-binary-search a keyboard user answers the 2-question round and sees explanations, marks the chapter done without opening the round, the wrong answer's question id is saved in the round result in groundwork:quiz, and the round writes nothing to jsnotes:progress, jsnotes:activity or XP."
covers = ["C10"]
after = [9]
hitl = false
risk = "medium"

[[entry]]
id = 11
type = "story"
title = "Check badges: First check passed and A level checked"
description = "Investigates how the site's existing badges are defined and reuses that mechanism to add First check passed (first pass on any chapter) and A level checked (every chapter of one level has a pass), earned through the check's pass and setChapterDone path with the chapter-level XP and streak unchanged."
verify = "A vitest run shows the first pass on any chapter earns First check passed, passing the last chapter of a level earns A level checked, marking done anyway earns neither, and a pass raises XP and streak exactly as a read mark does."
covers = ["C9"]
after = []
hitl = false
risk = "low"
unknown = "How the existing badge definitions are stored and where they render; the builder reads that code first and keeps the two new badges inside the same mechanism."

[[entry]]
id = 8
type = "story"
title = "Refactor sweep"
description = "Cleans up what entries 1 to 7 and 9 to 11 and their reviews deferred, scoped from their build records when it starts, and takes cleanup only."
verify = "npm run check, npm run build and npm run test:e2e pass, and every finding this epic deferred is fixed or moved to a named later entry."
covers = ["C1", "C2", "C3", "C4", "C5", "C6", "C7", "C8", "C9", "C10"]
after = [4, 5, 6, 7, 9, 10, 11]
hitl = false
risk = "low"
